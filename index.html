<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>财神爷 · 多策略Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1e1e2e;color:#cdd6f4;font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
.container{padding:40px}
h1{font-size:2.5rem;margin-bottom:8px}
h2{font-size:1.2rem;color:#6c7086;font-weight:400;margin-bottom:32px}
.cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:40px}
.card{background:#181825;border-radius:12px;padding:24px 32px;min-width:150px}
.card-title{color:#6c7086;font-size:0.85rem;margin-bottom:8px}
.card-value{font-size:1.8rem;font-weight:700}
.card-detail{color:#6c7086;font-size:0.8rem;margin-top:4px}
.status{color:#a6e3a1;font-size:1.1rem;margin-top:32px}
.footer{color:#6c7086;font-size:0.75rem;margin-top:48px}
</style></head>
<body>
<div class="container">
<h1>💰 财神爷 · 短线策略实盘</h1>
<h2>正股+期权双轨 · 4策略各 $100K · Day 0</h2>
<div class="cards">
  <div class="card" style="border-left:4px solid #89b4fa">
    <div class="card-title">A·RS动量</div><div class="card-value" style="color:#89b4fa">$100,000</div><div class="card-detail">待启动</div>
  </div>
  <div class="card" style="border-left:4px solid #a6e3a1">
    <div class="card-title">B·情绪驱动</div><div class="card-value" style="color:#a6e3a1">$100,000</div><div class="card-detail">待启动</div>
  </div>
  <div class="card" style="border-left:4px solid #f9e2af">
    <div class="card-title">C·均值回归</div><div class="card-value" style="color:#f9e2af">$100,000</div><div class="card-detail">待启动</div>
  </div>
  <div class="card" style="border-left:4px solid #f38ba8">
    <div class="card-title">D·财报事件</div><div class="card-value" style="color:#f38ba8">$100,000</div><div class="card-detail">待启动</div>
  </div>
</div>
<div class="status">🟢 系统就绪 · 等待首次交易日</div>
<div class="footer">财神爷交易系统 v3 · 首次真实交易日 2026-05-05</div>
</div>
</body></html>
