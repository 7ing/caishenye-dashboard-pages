<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财神爷 — 策略仪表盘</title>
<script src="https://cdn.plot.ly/plotly-2.35.9.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #11111b;
    color: #cdd6f4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
}
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid #313244;
}
.header h1 {
    font-size: 24px;
    font-weight: 700;
    color: #f5c2e7;
    display: flex;
    align-items: center;
    gap: 10px;
}
.header h1 span {
    font-size: 28px;
}
.header .subtitle {
    color: #6c7086;
    font-size: 13px;
}
.header .subtitle .date { color: #a6e3a1; }
.lang-toggle {
    display: inline-flex;
    align-items: center;
    background: #181825;
    border: 1px solid #45475a;
    border-radius: 6px;
    padding: 2px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    color: #6c7086;
    transition: all 0.2s;
    user-select: none;
    line-height: 1;
    height: 24px;
}
.lang-toggle:hover { border-color: #585b70; color: #a6adc8; }
.lang-toggle .active { color: #89b4fa; }
.lang-toggle .sep { color: #45475a; padding: 0 2px; }
.lang-toggle .inactive { color: #585b70; }
.summary-bar {
    display: flex;
    gap: 24px;
    margin-bottom: 24px;
    padding: 16px 20px;
    background: #181825;
    border-radius: 12px;
    border: 1px solid #313244;
    flex-wrap: wrap;
}
.summary-item {
    display: flex;
    flex-direction: column;
}
.summary-item .label {
    font-size: 11px;
    color: #6c7086;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}
.summary-item .value {
    font-size: 20px;
    font-weight: 700;
    color: #f5c2e7;
}
.summary-item .value.positive { color: #a6e3a1; }
.summary-item .value.negative { color: #f38ba8; }
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
}
.card {
    background: #181825;
    border-radius: 12px;
    padding: 14px;
    border: 1px solid #313244;
}
.card-header {
    font-size: 13px;
    font-weight: 600;
    color: #bac2de;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid #313244;
}
.card-body .kpi-row {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    font-size: 13px;
}
.card-body .kpi-label { color: #6c7086; }
.card-body .kpi-value { font-weight: 600; font-variant-numeric: tabular-nums; }
.section {
    margin-bottom: 24px;
}
.section-title {
    font-size: 20px;
    font-weight: 700;
    color: #f5c2e7;
    margin-bottom: 12px;
    padding-left: 8px;
    border-left: 3px solid #cba6f7;
}
.heatmap-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
}
@media (max-width: 700px) {
    .heatmap-grid {
        grid-template-columns: 1fr;
    }
    .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
    }
}
.footer {
    text-align: center;
    padding: 20px;
    color: #585b70;
    font-size: 12px;
    border-top: 1px solid #313244;
    margin-top: 24px;
}
.footer a { color: #89b4fa; text-decoration: none; }
</style>
</head>

<div class="header">
    <h1><span>💰</span> <span data-i18n="title">财神爷 · 短线策略实盘</span></h1>
    <div style="display:flex;align-items:center;gap:12px;">
        <div class="subtitle">
            <span data-i18n="data-label">数据日期</span> · <span class="date" id="update-date"><span data-i18n="loading">加载中</span>...</span><br>
            <span id="update-time" style="font-size:12px;color:#585b70;"></span>
        </div>
        <div class="lang-toggle" id="lang-toggle" onclick="toggleLang()" title="Switch language">
            <span id="lang-en-label" class="inactive">EN</span>
            <span class="sep">|</span>
            <span id="lang-zh-label" class="active">CN</span>
        </div>
    </div>
</div>

<div class="summary-bar">
    <div class="summary-item">
        <span class="label" data-i18n="best-strategy">最佳策略</span>
        <span class="value" style="color:#cdd6f4">N/A</span>
    </div>
    <div class="summary-item">
        <span class="label" data-i18n="strategies">策略数</span>
        <span class="value">0</span>
    </div>
    <div class="summary-item">
        <span class="label" data-i18n="tickers">总标的</span>
        <span class="value">10</span>
    </div>
    <div class="summary-item">
        <span class="label" data-i18n="period">周期</span>
        <span class="value" data-i18n="period-val">6个月</span>
    </div>
</div>

function applyLang(lang) {
    // Toggle button labels
    document.getElementById('lang-en-label').className = lang === 'en' ? 'active' : 'inactive';
    document.getElementById('lang-zh-label').className = lang === 'zh' ? 'active' : 'inactive';

    // Static text via data-i18n

            el.textContent = i18n[key][lang];

    });

        var chartMap = {
            'equity': {

                'xaxis': { 'title': { 'text': i18n['chart-equity-x'][lang] } },

            var plotDiv = section.querySelector('.js-plotly-plot');
            if (!plotDiv) return;

            var updates = JSON.parse(JSON.stringify(chartMap[chartId]));

            Plotly.relayout(plotDiv, updates);

            plotDiv.querySelectorAll('.scatterlayer .trace').forEach(function(traceEl, idx) {
                var traceIdx = idx;
                // Only update strat traces (not end labels)
                if (traceIdx < strats.length) {
                    Plotly.restyle(plotDiv, {
                        name: labels[traceIdx % strats.length],
                        'hovertemplate': [hoverTmpl],
                    }, [traceIdx]);
                }
            });
        });

    var dateEl = document.getElementById('update-date');
